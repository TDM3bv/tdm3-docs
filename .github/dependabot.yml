# Updates van npm-packages en GitHub Actions komen als PR naar de deploybranch.
# Minor en patch worden gebundeld; een major (bv. VitePress 2) komt als aparte PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: vitepress
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: vitepress
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
