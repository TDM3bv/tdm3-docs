# Publiceert elke PR naar de deploybranch als preview, zodat een reviewer de site kan bekijken
# zonder ze lokaal te bouwen. De preview staat op
#   https://docs.tdm3.be/pr-preview/pr-<nummer>/
# en de link komt als commentaar op de PR. Bij het sluiten of mergen van de PR verdwijnt de preview.
#
# De previews staan in de map pr-preview/ op de branch gh-pages, naast de live site.
# De deploy-workflow laat die map ongemoeid (clean-exclude).
name: PR preview

on:
  pull_request:
    branches: [vitepress]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

# Eén run per PR tegelijk; een nieuwe push wacht tot de vorige preview gepubliceerd is.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    # Een PR uit een fork krijgt een token zonder schrijfrechten. Die krijgt geen preview,
    # wel de build-check uit build.yml.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci
      - name: Build with VitePress
        if: github.event.action != 'closed'
        env:
          DOCS_BASE: /pr-preview/pr-${{ github.event.number }}/
        run: npm run docs:build
      # Publiceert de build bij een open PR en verwijdert de preview bij een gesloten PR.
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/.vitepress/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
