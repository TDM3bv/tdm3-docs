# Bouwt de site bij elke push naar de deploybranch en publiceert ze naar de branch gh-pages.
# GitHub Pages serveert die branch op docs.tdm3.be (Settings > Pages > Deploy from a branch).
#
# De site gaat via een branch en niet via een Pages-artifact, omdat de PR-previews
# (zie preview.yml) in dezelfde branch staan, in de map pr-preview/.
name: Deploy VitePress site to Pages

on:
  push:
    branches: [vitepress]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Een handmatige run op een andere branch mag de live site niet vervangen.
    if: github.ref == 'refs/heads/vitepress'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with VitePress
        run: |
          npm run docs:build
          touch docs/.vitepress/dist/.nojekyll
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/.vitepress/dist
          # De previews van open PR's blijven staan.
          clean-exclude: pr-preview/
          # Geen force-push: een preview die net gepubliceerd werd, mag niet verloren gaan.
          force: false
